<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0f6cbd" />
    <meta name="description" content="Private local investment portfolio tracker" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-title" content="Investment Portfolio" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="app-version" content="v1.6" />
    <meta name="code-version" content="v16r3" />
    <title>Investment Portfolio</title>
    <link rel="icon" href="app_icon.png" type="image/png" />
    <link rel="apple-touch-icon" href="app_icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="css/styles.css?v=16r3" />
  </head>
  <body>
    <div class="app-shell">
      <header class="app-header">
        <button type="button" class="icon-button hidden" id="back-button" aria-label="Go back">←</button>
        <div class="app-brand">
          <img src="app_icon.png" alt="" class="app-icon" width="44" height="44" />
          <div class="app-brand-text">
            <span class="app-name">
              <span class="app-name-investment">Investment</span>
              <span class="app-name-portfolio">Portfolio</span>
            </span>
            <span class="app-amount-mode" id="app-amount-mode"></span>
            <span class="app-subtitle hidden" id="page-subtitle"></span>
          </div>
        </div>
        <button type="button" class="text-button hidden" id="header-action"></button>
      </header>

      <main class="app-main" id="app-root" aria-live="polite"></main>

      <nav class="bottom-nav" id="bottom-nav" aria-label="Main navigation">
        <button type="button" class="nav-item active" data-nav="portfolio">
          <span class="nav-icon nav-icon-portfolio" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect class="portfolio-bar-red" x="3" y="12" width="4" height="9" rx="1.5" />
              <rect class="portfolio-bar-orange" x="10" y="7" width="4" height="14" rx="1.5" />
              <rect class="portfolio-bar-orange" x="17" y="3" width="4" height="18" rx="1.5" />
              <path class="portfolio-axis" d="M2 21.5h20" stroke-width="1.5" stroke-linecap="round" />
            </svg>
          </span>
          <span>Portfolio</span>
        </button>
        <button type="button" class="nav-item" data-nav="reminders">
          <span class="nav-icon nav-icon-reminders" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M12 3a5.5 5.5 0 0 0-5.5 5.5v2.1l-1.4 2.8a1 1 0 0 0 .9 1.4h11.9a1 1 0 0 0 .9-1.4l-1.4-2.8V8.5A5.5 5.5 0 0 0 12 3Z" fill="#f59e0b"/>
              <path d="M10 18.5a2 2 0 0 0 4 0" stroke="#d97706" stroke-width="1.5" stroke-linecap="round"/>
              <circle cx="17" cy="5" r="2.5" fill="#ef4444"/>
            </svg>
          </span>
          <span>Reminders</span>
        </button>
        <button type="button" class="nav-item" data-nav="reports">
          <span class="nav-icon nav-icon-reports" aria-hidden="true">&#x1F4CB;</span>
          <span>Reports</span>
        </button>
        <button type="button" class="nav-item" data-nav="settings">
          <span class="nav-icon nav-icon-settings" aria-hidden="true">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <circle cx="12" cy="12" r="3" stroke="currentColor" stroke-width="1.75" />
              <path
                d="M12.22 2h-.44a2 2 0 0 0-2 2v.18a2 2 0 0 1-1 1.73l-.43.25a2 2 0 0 1-2 0l-.15-.08a2 2 0 0 0-2.73.73l-.22.38a2 2 0 0 0 .73 2.73l.15.1a2 2 0 0 1 1 1.72v.51a2 2 0 0 1-1 1.74l-.15.09a2 2 0 0 0-.73 2.73l.22.38a2 2 0 0 0 2.73.73l.15-.08a2 2 0 0 1 2 0l.43.25a2 2 0 0 1 1 1.73V20a2 2 0 0 0 2 2h.44a2 2 0 0 0 2-2v-.18a2 2 0 0 1 1-1.73l.43-.25a2 2 0 0 1 2 0l.15.08a2 2 0 0 0 2.73-.73l.22-.39a2 2 0 0 0-.73-2.73l-.15-.08a2 2 0 0 1-1-1.74v-.5a2 2 0 0 1 1-1.74l.15-.09a2 2 0 0 0 .73-2.73l-.22-.38a2 2 0 0 0-2.73-.73l-.15.08a2 2 0 0 1-2 0l-.43-.25a2 2 0 0 1-1-1.73V4a2 2 0 0 0-2-2z"
                stroke="currentColor"
                stroke-width="1.75"
                stroke-linecap="round"
                stroke-linejoin="round"
              />
            </svg>
          </span>
          <span>Settings</span>
        </button>
      </nav>
    </div>

    <button type="button" class="fab hidden" id="fab-button" aria-label="Add item">+</button>

    <div id="pin-lock" class="pin-lock hidden" aria-hidden="true"></div>

    <div id="help-modal" class="help-modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="help-modal-title">
      <button type="button" class="help-modal-backdrop" data-help-close aria-label="Close Help / FAQ"></button>
      <section class="help-modal-card card">
        <div class="help-modal-header">
          <h2 class="help-modal-title" id="help-modal-title">Help / FAQ</h2>
          <button type="button" class="help-modal-close" data-help-close aria-label="Close Help / FAQ">×</button>
        </div>
        <div class="help-modal-body" id="help-modal-body"></div>
      </section>
    </div>

    <div id="share-modal" class="help-modal hidden" aria-hidden="true" role="dialog" aria-modal="true" aria-labelledby="share-modal-title">
      <button type="button" class="help-modal-backdrop" data-share-close aria-label="Close share"></button>
      <section class="help-modal-card card">
        <div class="help-modal-header">
          <h2 class="help-modal-title" id="share-modal-title">Share Project</h2>
          <button type="button" class="help-modal-close" data-share-close aria-label="Close share">×</button>
        </div>
        <div class="help-modal-body" id="share-modal-body"></div>
      </section>
    </div>

    <div id="app-version-info" hidden aria-hidden="true">
      <span id="app-version">v1.6</span>
      <span id="code-version">v16r3</span>
    </div>

    <script type="module" src="js/app.js?v=16r3"></script>
  </body>
</html>
